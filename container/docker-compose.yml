services:

  kafka:
    hostname: kafka
    container_name: kafka
    image: &kafkaImage apache/kafka:4.3.1
    networks:
      - internal
      - external
    ports:
      - 9092:9092
    environment:
      # KRaft mode: combined broker + controller, no ZooKeeper required
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped

  # --- Flink Ecosystem ---
  jobmanager:
    hostname: jobmanager
    container_name: jobmanager
    build:
      context: ./flink
      dockerfile: Dockerfile
      network: host
    networks:
      - internal
      - external
    depends_on:
      - kafka
    ports:
      - "8181:8081" # Flink Web UI
    volumes:
      - ../development/flink/opt/flink/uppercase_users.py:/opt/flink/uppercase_users.py
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    restart: unless-stopped

  taskmanager:
    hostname: taskmanager
    container_name: taskmanager
    build:
      context: ./flink
      dockerfile: Dockerfile
      network: host
    networks:
      - internal
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 10
    restart: unless-stopped

  # --- schema-registry Ecosystem ---
  schema-registry:
    hostname: schema-registry
    container_name: schema-registry
    image: quay.io/apicurio/apicurio-registry:3.3
    networks:
      - internal
      - external
    depends_on:
      - kafka
    ports:
      - "8081:8080" # Apicurio internal port is 8080
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped

  # --- streams application Ecosystem ---
  streams:
    hostname: streams
    container_name: streams
    build:
      context: ./streams
      dockerfile: Dockerfile
    networks:
      - internal
      - external
    depends_on:
      - kafka
    volumes:
      - ../development/streams/apisl.handson.kafka.streams/RUN_STREAMS.sh:/streams/apisl.handson.kafka.streams/RUN_STREAMS.sh
      - ../development/streams/apisl.handson.kafka.streams/pom.xml:/streams/apisl.handson.kafka.streams/pom.xml
      - ../development/streams/apisl.handson.kafka.streams/src:/streams/apisl.handson.kafka.streams/src
    working_dir: /streams
    entrypoint: ./apisl.handson.kafka.streams/RUN_STREAMS.sh
    restart: unless-stopped

  # --- cdc Ecosystem ---
  debezium:
    hostname: debezium
    container_name: debezium
    image: debezium/connect:3.0.0.Final
    networks:
      - internal
      - external
    ports:
      - 8083:8083
    depends_on:
      - kafka
      - mysql
    environment:
      GROUP_ID: 1
      BOOTSTRAP_SERVERS: kafka:29092
      CONFIG_STORAGE_TOPIC: _kafka_connect_configs
      OFFSET_STORAGE_TOPIC: _kafka_connect_offsets
      STATUS_STORAGE_TOPIC: _kafka_connect_statuses
    restart: unless-stopped

  mysql:
    hostname: mysql
    container_name: mysql
    image: mysql:8.0
    networks:
      - internal
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: mysqld
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: "Asia/Tokyo"
    restart: unless-stopped

  # --- web ui Ecosystem ---
  akhq:
    hostname: akhq
    container_name: akhq
    image: tchiotludo/akhq:0.28.0
    networks:
      - internal
      - external
    ports:
      - 8080:8080
    depends_on:
      - kafka
    environment:
      MICRONAUT_ENVIRONMENTS: docker
    volumes:
      - ./akhq/application.yml:/app/application.yml
    restart: unless-stopped

  # --- handson client for running kafka CLI commands ---
  handson-client:
    hostname: handson-client
    container_name: handson-client
    build:
      context: ./handson-client
      dockerfile: Dockerfile
      network: host
    networks:
      - internal
    depends_on:
      - kafka
    command: sleep infinity
    restart: unless-stopped

networks:
  internal:
    name: intra-net
    driver: bridge
    internal: true
  external:
    name: hands-net
    driver: bridge
