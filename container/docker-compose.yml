services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.1
    hostname: zookeeper
    container_name: zookeeper
    networks:
      - internal
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
#      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  broker:
    image: confluentinc/cp-kafka:7.8.1
    hostname: broker
    container_name: broker
    networks:
      - internal
      - external
    ports:
      - 9092:9092
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
#      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
#      KAFKA_JMX_PORT: 9101
#      KAFKA_JMX_HOSTNAME: localhost
    restart: unless-stopped

  # --- Flink Ecosystem ---
  jobmanager:
    hostname: jobmanager
    container_name: jobmanager
    build:
      context: ./flink
      dockerfile: Dockerfile
      network: host
    networks:
      - internal
      - external
    depends_on:
      - broker
    ports:
      - "8181:8081" # Flink Web UI
    volumes:
      - ../development/flink/opt/flink/uppercase_users.py:/opt/flink/uppercase_users.py
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    restart: unless-stopped

  taskmanager:
    hostname: taskmanager
    container_name: taskmanager
    build:
      context: ./flink
      dockerfile: Dockerfile
      network: host
    networks:
      - internal
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 10
    restart: unless-stopped

  # --- schema-registry Ecosystem ---
  schema-registry:
    hostname: schema-registry
    container_name: schema-registry
    image: quay.io/apicurio/apicurio-registry:latest
    networks:
      - internal
      - external
    depends_on:
      - broker
    ports:
      - "8081:8080" # Apicurio internal port is 8080
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: broker:29092
    restart: unless-stopped

  # --- streams application Ecosystem ---
  streams:
    hostname: streams
    container_name: streams
    build:
      context: ./streams
      dockerfile: Dockerfile
    networks:
      - internal
      - external
    depends_on:
      - broker
    volumes:
      - ../development/streams/apisl.handson.kafka.streams/RUN_STREAMS.sh:/streams/apisl.handson.kafka.streams/RUN_STREAMS.sh
      - ../development/streams/apisl.handson.kafka.streams/pom.xml:/streams/apisl.handson.kafka.streams/pom.xml
      - ../development/streams/apisl.handson.kafka.streams/src:/streams/apisl.handson.kafka.streams/src
    working_dir: /streams
    entrypoint: ./apisl.handson.kafka.streams/RUN_STREAMS.sh
    restart: unless-stopped

  # --- cdc Ecosystem ---
  debezium:
    image: debezium/connect:3.0.0.Final
    hostname: debezium
    container_name: debezium
    networks:
      - internal
      - external
    ports:
      - 8083:8083
    depends_on:
      - broker
      - mysql
    environment:
      GROUP_ID: 1
      BOOTSTRAP_SERVERS: broker:29092
      CONFIG_STORAGE_TOPIC: _kafka_connect_configs
      OFFSET_STORAGE_TOPIC: _kafka_connect_offsets
      STATUS_STORAGE_TOPIC: _kafka_connect_statuses
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    hostname: mysql
    container_name: mysql
    networks:
      - internal
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: mysqld
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: "Asia/Tokyo"
    restart: unless-stopped

  # --- web ui Ecosystem ---
  akhq:
    image: tchiotludo/akhq:latest
    hostname: akhq
    container_name: akhq
    networks:
      - internal
      - external
    ports:
      - 9021:8080
    depends_on:
      - broker
    environment:
      MICRONAUT_ENVIRONMENTS: docker
    volumes:
      - ./akhq/application.yml:/app/application.yml
    restart: unless-stopped

networks:
  internal:
    name: intra-net
    driver: bridge
    internal: true
  external:
    name: hands-net
    driver: bridge
